<style>
:root{--bg:#0E1F26;--bg2:#14303A;--bg3:#1E4350;--ink:#EAF4F2;--a:#FF8A3D;--a2:#37C8C0;--on:#1A0E05;--tf:contrast(1.06) saturate(1.1);--mut:color-mix(in srgb,var(--ink) 68%,transparent);--ln:color-mix(in srgb,var(--ink) 16%,transparent);color-scheme:dark}

[data-g=mono]{--bg:#202124;--bg2:#2B2C30;--bg3:#383A3F;--ink:#F1F1F0;--a:#FFFFFF;--a2:#A3A6AD;--on:#16171A;--tf:grayscale(1) contrast(1.08)}
[data-g=neon]{--bg:#1E1238;--bg2:#2B1A50;--bg3:#3B2569;--ink:#F6EEFF;--a:#FF3D9A;--a2:#2FE3F5;--on:#1E0A18;--tf:saturate(1.35) contrast(1.08) hue-rotate(-8deg)}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Hanken Grotesk',system-ui,sans-serif;overflow-x:hidden;transition:background .5s,color .5s}

a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a2);outline-offset:3px}

.top{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.pg{height:3px}.pg i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:var(--a)}

.hi{margin:0;font-size:20px;font-weight:600;color:var(--mut)}

.w{display:block;overflow:hidden;padding-bottom:.05em}
.w>span{display:block;animation:up .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*110ms + 80ms)}

.hero:not(.still) .mon{animation:fi 1s .4s both}
.mon::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.78),transparent 52%),linear-gradient(to bottom,rgba(0,0,0,.4),transparent 24%)}

#htc{position:absolute;z-index:4;right:28px;top:24px;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pip{position:absolute;z-index:4;right:26px;bottom:52px;width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:var(--a);color:var(--on);display:grid;place-items:center;font:800 26px Archivo,sans-serif}

.sg .dn::after{width:100%}.sg .on::after{width:calc(var(--p,0)*100%)}

.dt{padding:14px 6px 6px}.dt h3{font-size:30px;text-transform:uppercase;line-height:1}.dt p{color:var(--mut);margin:6px 0 14px}

.ln{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--ln)}.rl+.ln{border-top:0}

.ck:hover{transform:translateY(-2px)}.ck strong{display:block;line-height:1.2}.ck small{display:block;color:var(--mut);font-size:13px}
.empty{padding:28px;border:1px dashed var(--ln);border-radius:14px;color:var(--mut)}

.lk{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}

.lk a:hover{padding-left:16px;color:var(--a)}.lk small{font:500 15px 'Hanken Grotesk',sans-serif;color:var(--mut);text-transform:none;overflow-wrap:anywhere;text-align:right}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

function info(u){u=(u||"").trim();let x,m,id;try{x=new URL(u)}catch(e){return{k:"none"}}

  id=h=="youtu.be"?p.slice(1).split("/")[0]:h=="youtube.com"?((m=p.match(/^\/(shorts|embed|live)\/([\w-]+)/))?m[2]:q.get("v")):"";

  if(h=="vimeo.com"&&(m=p.match(/\/(\d+)/)))return{k:"vm",l:"Vimeo",e:`https://player.vimeo.com/video/${m[1]}?autoplay=1`,t:`https://vumbnail.com/${m[1]}.jpg`,auto:1};
  if(h=="tiktok.com"&&(m=p.match(/\/video\/(\d+)/)))return{k:"tt",l:"TikTok",v:1,e:`https://www.tiktok.com/embed/v2/${m[1]}`};
  if(h=="drive.google.com"){if(m=p.match(/\/folders\/([\w-]+)/))return{k:"df",l:"Google Drive",e:`https://drive.google.com/embeddedfolderview?id=${m[1]}#grid`};
    id=(m=p.match(/\/file\/d\/([\w-]+)/))?m[1]:q.get("id");if(id)return{k:"dv",l:"Google Drive",e:`https://drive.google.com/file/d/${id}/preview`,t:`https://drive.google.com/thumbnail?id=${id}&sz=w800`,auto:1}}
  if(/\.(mp4|webm|mov|m4v)$/i.test(p))return{k:"vid",l:"Video",e:u};

const HS={i:0,t:0,n:0,last:0,raf:0,paused:false,dur:5200};

    m.onpointermove=e=>{if(RM||e.pointerType!="mouse")return;const r=m.getBoundingClientRect();m.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*7+"deg");m.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*5+"deg")}}}
function hsGo(i){const s=$$(".sl"),g=$$(".sg button");if(!s.length)return;i=(i+s.length)%s.length;HS.i=i;HS.t=0;s.forEach((e,j)=>e.classList.toggle("on",j==i));g.forEach((e,j)=>{e.classList.toggle("on",j==i);e.classList.toggle("dn",j<i);e.style.setProperty("--p",0)});hsPaint()}

    h+=tab=="profil"?`<label>Foto profil<input type="file" accept="image/*" data-a="photo"></label>`+PF.map(f=>fld("profile","",f[0],f[1],P[f[0]]||"",f[2])).join(""):D[tab].map((it,i)=>row(tab,i,it)).join("")+`<button class="b p" data-a="add" data-v="${tab}">+ Tambah</button>`;
    h+=`</div><div class="ft"><button class="b p" data-a="save">Simpan & terbitkan</button><span id="st"></span><small id="sz"></small></div></aside>`}
  e.innerHTML=h;if(sc&&$(".bd"))$(".bd").scrollTop=sc;sz()}
const sz=()=>{const el=$("#sz");if(el)el.textContent=Math.round(new Blob([JSON.stringify(D)]).size/1000)+" / 1000 KB"};
const norm=x=>({profile:{...SEED.profile,...(x.profile||{})},works:x.works||[],folders:x.folders||[],tools:x.tools||[]});
let auth=null,ref=null;
if(firebaseConfig.apiKey==="ISI"){ready=true;view();toast("Isi firebaseConfig di index.html dulu")}
else{
  const app=initializeApp(firebaseConfig),db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});auth=getAuth(app);ref=doc(db,"site","main");
  setTimeout(()=>{if(!ready){ready=true;view();toast("Database lambat merespons, menampilkan data sementara")}},6000);
  onAuthStateChanged(auth,u=>{
    if(u&&u.email!==ADMIN_EMAIL){toast("Akun ini tidak punya izin edit");signOut(auth);return}
    can=!!u;if(!can)open=false;adm();if(ready)view();
  });
  onSnapshot(ref,s=>{
    if(can&&open&&ready)return;
    if(s.exists()){D=norm(s.data());P=D.profile}
    ready=true;view();adm();
  },e=>{ready=true;view();toast("Gagal memuat data: "+e.code)});
}
const enc=(c,q)=>{const w=c.toDataURL("image/webp",q);return w.startsWith("data:image/webp")?w:c.toDataURL("image/jpeg",q)};
const shrink=(f,m,q)=>new Promise((r,j)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(enc(c,q))};i.onerror=j;i.src=URL.createObjectURL(f)});
const frame=f=>new Promise((res,rej)=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=URL.createObjectURL(f);v.onerror=rej;v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||3)/3)};v.onseeked=()=>{const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext("2d").drawImage(v,0,0,c.width,c.height);URL.revokeObjectURL(v.src);res(enc(c,.72))}});
async function save(){
  if(new Blob([JSON.stringify(D)]).size>950000){toast("Data terlalu besar. Pakai URL gambar untuk sebagian thumbnail.");return}
  $("#st").textContent="Menyimpan…";
  try{await setDoc(ref,JSON.parse(JSON.stringify(D)));dirty=false;$("#st").textContent="Tersimpan ✓"}
  catch(e){$("#st").textContent="";toast("Gagal menyimpan: "+(e.code||e.message))}
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-f],[data-o],[data-gr],[data-s],[data-b],[data-a]");if(!t)return;const d=t.dataset;
  if(d.f){fw=d.f;$("#karya").innerHTML=wsec()}
  else if(d.o){openLB(d.o[0],+d.o.slice(1))}
  else if(d.gr){setGrade(d.gr);$$(".gr button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.gr==grade))}
  else if(d.s!==undefined&&t.closest(".sg")){hsGo(+d.s)}
  else if(d.b){bt=d.b;$$("[data-b]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.b==bt))}
  else if(d.a=="brief"){const n=($("#bn").value||"").trim();window.open(waUrl("Halo "+P.name+", saya mau diskusi proyek "+bt+"."+(n?" Kebutuhan: "+n:"")),"_blank","noopener")}
  else if(d.a=="lbx")lb.close();else if(d.a=="lbn")lbGo(1);else if(d.a=="lbp")lbGo(-1);
  else if(d.a=="login"){e.preventDefault();if(!auth){toast("Firebase belum dikonfigurasi");return}
    if(auth.currentUser)signOut(auth);else try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){toast("Login dibatalkan")}}
  else if(d.a=="tog"){open=!open;adm()}
  else if(d.a=="tab"){tab=d.v;adm()}
  else if(d.a=="add"){const o=Object.fromEntries(F[d.v].map(f=>[f[0],""]));if(d.v!="tools")o.th="";D[d.v].push(o);exp.add(d.v+":"+(D[d.v].length-1));dirty=true;adm();view();$(".bd").scrollTop=1e5}
  else if(d.a=="del"){if(!confirm("Hapus item ini?"))return;const[s,i]=d.v.split(":");D[s].splice(+i,1);exp.clear();dirty=true;adm();view()}
  else if(d.a=="mv"){const[s,i,m]=d.v.split(":"),a=D[s],j=+i+ +m;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];exp.clear();dirty=true;adm();view()}
  else if(d.a=="thx"){const[s,i]=d.v.split(":");D[s][i].th="";dirty=true;adm();view()}
  else if(d.a=="save")save();
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(!d.k)return;(d.s=="profile"?P:D[d.s][d.i])[d.k]=t.type=="checkbox"?t.checked:t.value;dirty=true;clearTimeout(tm);tm=setTimeout(()=>{view();sz()},350)});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.ex;if(k)e.target.open?exp.add(k):exp.delete(k)},true);
document.addEventListener("change",async e=>{const t=e.target,d=t.dataset,f=t.files&&t.files[0];if(!f||!d.a)return;
  try{if(d.a=="photo")P.photo=await shrink(f,640,.85);else if(d.a=="th")D[d.s][d.i].th=await shrink(f,480,.72);else if(d.a=="thv")D[d.s][d.i].th=await frame(f);else return}
  catch(x){toast("Gambar gagal diproses");return}
  dirty=true;adm();view();toast("Gambar siap. Klik Simpan & terbitkan.")});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key=="s"&&can&&open){e.preventDefault();save()}});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
</script>
