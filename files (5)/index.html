<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nama Kamu – Video Editor & Cinematographer</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{--paper:#F4F1FF;--ink:#16123F;--card:#fff;--blue:#3B4DFF;--pink:#FF8FC7;--lemon:#FFE24D;--mint:#5FE3B0;--orange:#FF7A3D;--sky:#9DB2FF;--on:#16123F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14113A;--ink:#F4F1FF;--card:#221E5C}}
:root[data-theme="dark"]{--paper:#14113A;--ink:#F4F1FF;--card:#221E5C}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--paper)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 'Instrument Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blue);z-index:5}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
h1,h2,h3,.dp{font-family:Syne,sans-serif;font-weight:800}
.b{font:700 16px 'Instrument Sans',sans-serif;display:inline-block;text-decoration:none;cursor:pointer;background:var(--lemon);color:var(--on);border:3px solid var(--on);border-radius:99px;padding:10px 22px;box-shadow:4px 4px 0 var(--on)}
.b:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--on)}
.b.k{background:var(--on);color:#fff;box-shadow:4px 4px 0 var(--pink)}
/* hero */
.hero{background:var(--blue);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:20px;padding-bottom:20px;font-weight:700}
.nav b{font:800 22px Syne}.nav a{text-decoration:none;margin-left:16px;font-size:15px}
.hg{display:grid;grid-template-columns:1.5fr 1fr;gap:34px;align-items:center;padding-top:30px;padding-bottom:56px}
.hi{margin:0;font-size:20px;font-weight:600}
h1{font-size:clamp(52px,12vw,160px);line-height:.88;letter-spacing:-.03em;margin:6px 0 24px;text-shadow:5px 5px 0 var(--on);word-break:break-word}
.stk span{display:inline-block;padding:7px 16px;border:3px solid var(--on);border-radius:99px;font-weight:700;color:var(--on);margin:0 8px 12px 0}
.bio{max-width:46ch;font-size:19px;margin:8px 0 28px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.pic{width:100%;max-width:380px;aspect-ratio:1;justify-self:center;border:4px solid var(--on);border-radius:44% 56% 48% 52%/52% 44% 56% 48%;overflow:hidden;background:var(--lemon);box-shadow:10px 10px 0 var(--on);transform:rotate(3deg);display:grid;place-items:center;font:800 96px Syne;color:var(--on)}
.pic img{width:100%;height:100%;object-fit:cover}
.mq{border-block:4px solid var(--on);background:var(--lemon);color:var(--on);overflow:hidden;white-space:nowrap}
.mq div{display:inline-flex;gap:28px;padding:12px 0;animation:mq 30s linear infinite;font:800 24px Syne}
.mq i{font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}
/* sections */
section{padding-top:88px}
h2{font-size:clamp(38px,6.5vw,68px);line-height:1;letter-spacing:-.02em;margin:0 0 10px;display:flex;align-items:center;gap:14px}
h2 .n{font:800 18px Syne;min-width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;transform:rotate(-8deg);background:var(--mint);color:var(--on)}
.sub{margin:0 0 26px;max-width:50ch;opacity:.8}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.chip{font:700 15px 'Instrument Sans',sans-serif;padding:7px 18px;border-radius:99px;border:3px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:34px 28px;padding:0 8px 8px 0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
.card:nth-child(even){transform:rotate(1.2deg)}.card:nth-child(3n){transform:rotate(-1.2deg)}
.pst{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;width:100%;aspect-ratio:9/13;padding:16px;background:var(--c);color:var(--on)}
.pst:focus-visible{outline:3px solid var(--ink);outline-offset:-8px}
.tg{align-self:flex-start;font-style:normal;font-weight:700;font-size:14px;border:2px solid var(--on);border-radius:99px;padding:2px 12px;background:rgba(255,255,255,.6)}
.pl{align-self:center;width:76px;height:76px;border-radius:50%;background:var(--on);position:relative}
.pl::after{content:"";position:absolute;left:30px;top:22px;border-left:26px solid var(--c);border-top:16px solid transparent;border-bottom:16px solid transparent}
.pst strong{font:800 28px/1 Syne;letter-spacing:-.02em}
.card iframe{width:100%;aspect-ratio:9/13;border:0;display:block;background:#fff}
.mt{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;font-size:14px;border-top:3px solid var(--ink)}
.mt a{font-weight:700}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:46px 28px;padding:30px 8px 8px 0}
.bin{position:relative;display:block;text-decoration:none;color:var(--on);background:var(--c);border:3px solid var(--ink);border-radius:0 20px 20px 20px;padding:24px 22px;box-shadow:7px 7px 0 var(--ink);min-height:180px}
.bin::before{content:"";position:absolute;left:-3px;top:-28px;width:96px;height:28px;background:var(--c);border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
.bin h3{font-size:26px;line-height:1.05;margin:14px 0 8px}.bin p{margin:0 0 16px}
.bin b{display:inline-block;background:var(--on);color:#fff;border-radius:99px;padding:6px 16px}
.tools{display:flex;flex-wrap:wrap;gap:16px}
.tool{padding:10px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--c);color:var(--on);font-weight:700;box-shadow:4px 4px 0 var(--ink)}
.tool small{display:block;font-weight:400;font-size:13px}
.empty{padding:30px;border:3px dashed var(--ink);border-radius:20px}
#kontak{margin-top:100px;background:var(--lemon);color:var(--on);border-top:4px solid var(--on);padding:70px 0 54px}
#kontak h2{font-size:clamp(44px,9vw,120px);line-height:.92;display:block;max-width:12ch;margin-bottom:30px}
#kontak small{display:block;margin-top:40px}
/* admin */
#adm .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--card);color:var(--ink);border-left:4px solid var(--ink);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.tb{display:flex;gap:8px;padding:14px;border-bottom:3px solid var(--ink);align-items:center;flex-wrap:wrap}
.tb .x{margin-left:auto;font-size:20px;background:none;border:0;color:var(--ink);cursor:pointer}
.bd{overflow-y:auto;padding:16px;flex:1}
.bd label{display:block;font-weight:700;font-size:14px;margin-bottom:12px}
.bd input,.bd textarea{display:block;width:100%;margin-top:4px;font:400 16px 'Instrument Sans',sans-serif;padding:9px 11px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.it{border:3px solid var(--ink);border-radius:14px;padding:14px 14px 4px;margin-bottom:16px;position:relative}
.del{background:none;border:0;color:#d4311e;font-weight:700;cursor:pointer;padding:0 0 12px}
.ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);display:flex;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.toast.on{opacity:1}
@media (max-width:760px){.hg{grid-template-columns:1fr}.pic{max-width:260px;justify-self:start}.nav a{margin-left:10px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.mq div{animation:none}html{scroll-behavior:auto}}

/* ===== responsif: HP, tablet, desktop ===== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
h1{overflow-wrap:anywhere}
.wrap{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:46px}
.chip{min-height:42px}
.card,.bin{transition:transform .15s,box-shadow .15s}
.card.play{grid-column:1/-1;width:100%;max-width:430px;justify-self:center;transform:none}
.card iframe{aspect-ratio:9/15;min-height:560px}
@media (hover:hover){.card:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink)}.bin:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink)}.card.play:hover{transform:none;box-shadow:7px 7px 0 var(--ink)}}
@media (min-width:1200px){.wrap{max-width:1240px}.grid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:761px) and (max-width:1199px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  section{padding-top:64px}
  .hg{padding-top:8px;padding-bottom:40px;gap:28px}
  .cta .b{flex:1 1 150px}
  .grid{grid-template-columns:repeat(2,1fr);gap:24px 16px}
  .card:nth-child(n){transform:none}.card.play{max-width:none}
  .pst{padding:12px}.pst strong{font-size:19px}.pl{width:56px;height:56px}.pl::after{left:22px;top:15px;border-left-width:20px;border-top-width:13px;border-bottom-width:13px}
  .mt{flex-direction:column;gap:2px;padding:10px 12px}
  .bins{grid-template-columns:1fr}
  .dr{width:100%;height:100dvh;border-left:0}
  #adm .fab{right:14px}
}
@media (max-width:480px){.nav span a:nth-child(2),.nav span a:nth-child(3){display:none}.nav b{font-size:19px}h2 .n{min-width:32px;height:32px;font-size:15px}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;font-weight:700">Memuat…</p></div><div id="adm"></div><div class="toast" id="toast"></div>

<script>

<!-- KODE UTAMA APLIKASI DAN LOGIKA FIRESTORE/AUTH -->
<script type="module">

/* ===== 1. ISI KONFIGURASI FIREBASE (dari Project settings > Your apps) ===== */
const firebaseConfig={apiKey:"AIzaSyC9i9aMDbBrwv65PT9dE6u7pHvdsRyCag4",authDomain:"portoflioeja.firebaseapp.com",projectId:"portoflioeja",appId:"1:981082806055:web:65d6cc426a3587f7bebb02"};

let D=structuredClone(SEED),P=D.profile;const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const U=u=>/^https?:\/\//i.test(u||"")?esc(u):"#",PAL=["--pink","--lemon","--mint","--orange","--sky"];
let fw="Semua",ft="",open=false,tab="profil",can=false,tm,ready=false;

const emb=u=>{try{const x=new URL(u);return /(^|\.)instagram\.com$/.test(x.hostname)?x.origin+x.pathname.replace(/\/?$/,"/")+"embed":""}catch(e){return""}};

function view(){
  const roles=P.roles.split(",").map(s=>s.trim()).filter(Boolean),
  cats=[...new Set([...D.works.map(w=>w.cat),...D.folders.map(f=>f.cat)])],
  cc=c=>`var(${PAL[Math.max(0,cats.indexOf(c))%5]})`,
  wc=[...new Set(D.works.map(w=>w.cat))],gs=[...new Set(D.tools.map(t=>t.g))];
  if(fw!="Semua"&&!wc.includes(fw))fw="Semua";if(!gs.includes(ft))ft=gs[0];

  document.title=P.name+" – "+roles.slice(0,2).join(" & ");
  $("#app").innerHTML=`<header class="hero"><nav class="wrap nav"><b>${esc(P.name)}</b><span><a href="#karya">Karya</a><a href="#drive">Drive</a><a href="#alat">Alat</a><a href="#kontak">Kontak</a></span></nav>
<div class="wrap hg"><div><p class="hi">${esc(P.headline)}</p><h1>${esc(P.name)}</h1><div class="stk">${roles.map((r,i)=>`<span style="background:var(${PAL[i%5]});transform:rotate(${[-3,2,-1.5,3][i%4]}deg)">${esc(r)}</span>`).join("")}</div><p class="bio">${esc(P.bio)}</p><div class="cta"><a class="b" href="${wa}" target="_blank" rel="noopener">Chat WhatsApp</a><a class="b k" href="mailto:${esc(P.email)}">Kirim email</a></div></div>
<div class="pic">${ph?`<img src="${esc(P.photo)}" alt="${esc(P.name)}">`:esc(P.name.split(" ").map(w=>w[0]).join("").slice(0,2))}</div></div>
<div class="mq" aria-hidden="true"><div>${mk}${mk}</div></div></header>
<main class="wrap">
<section id="karya"><h2>Karya <span class="n">${D.works.length}</span></h2><p class="sub">Tekan play, videonya jalan langsung di sini tanpa pindah ke Instagram.</p>
<div class="chips">${["Semua",...wc].map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${c==fw}">${esc(c)}</button>`).join("")}</div>
<div class="grid">${ws.map(w=>`<article class="card" style="--c:${cc(w.cat)}"><button class="pst" data-p="${w.i}" aria-label="Putar ${esc(w.t)}"><em class="tg">${esc(w.cat)}</em><span class="pl"></span><strong>${esc(w.t)}</strong></button><div class="mt"><span>${esc(w.n)}</span><a href="${U(w.url)}" target="_blank" rel="noopener">Buka di IG</a></div></article>`).join("")||'<div class="empty">Belum ada karya.</div>'}</div></section>
<section id="drive"><h2>Arsip di Drive <span class="n">${D.folders.length}</span></h2><p class="sub">File master, RAW, dan project lengkap. Setiap map terbuka langsung di Google Drive.</p>
<div class="bins">${D.folders.map(f=>`<a class="bin" style="--c:${cc(f.cat)}" href="${U(f.url)}" target="_blank" rel="noopener"><em class="tg">${esc(f.cat)}</em><h3>${esc(f.n)}</h3><p>${esc(f.d)}</p><b>Buka folder</b></a>`).join("")}</div></section>
<section id="alat"><h2>Alat kerja</h2><p class="sub">Dipakai dari pengambilan gambar sampai file akhir.</p>
<div class="chips">${gs.map(g=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${g==ft}">${esc(g)}</button>`).join("")}</div>
<div class="tools">${D.tools.filter(t=>t.g==ft).map(t=>`<div class="tool" style="--c:var(${PAL[gs.indexOf(t.g)%5]})">${esc(t.n)}<small>${esc(t.d)}</small></div>`).join("")}</div></section></main>
<footer id="kontak"><div class="wrap"><h2>Punya ide? Ayo bikin bareng.</h2><div class="cta"><a class="b k" href="${wa}" target="_blank" rel="noopener">Chat WhatsApp</a><a class="b" style="background:#fff" href="mailto:${esc(P.email)}">Kirim email</a><a class="b" style="background:var(--pink)" href="${U(P.ig)}" target="_blank" rel="noopener">Instagram</a></div><small>© ${new Date().getFullYear()} ${esc(P.name)}${P.city?" · "+esc(P.city):""} · <a href="#" data-a="login">${can?"Keluar admin":"Admin"}</a></small></div></footer>`;
}

/* ===== dashboard admin ===== */
const F={works:[["t","Judul"],["cat","Kategori (mis. Commercial)"],["url","Link Instagram (Reel / Post)"],["n","Catatan singkat (klien, tahun)"]],folders:[["n","Nama folder"],["cat","Kategori"],["url","Link folder Google Drive"],["d","Deskripsi"]],tools:[["g","Grup (Software / Kamera & alat / Gaya visual)"],["n","Nama"],["d","Keterangan"]]};
const PF=[["name","Nama"],["headline","Kalimat pembuka"],["roles","Keahlian (pisahkan dengan koma)"],["bio","Bio","a"],["city","Kota"],["wa","WhatsApp (format 628…)"],["email","Email"],["ig","Link Instagram profil"]];
const fld=(s,i,k,l,v,a)=>`<label>${l}${a?`<textarea data-s="${s}" data-i="${i}" data-k="${k}" rows="3">${esc(v)}</textarea>`:`<input data-s="${s}" data-i="${i}" data-k="${k}" value="${esc(v)}">`}</label>`;
function adm(){
  const e=$("#adm");if(!can){e.innerHTML="";return}
  let h='<button class="b fab" data-a="tog">✎ Edit situs</button>';
  if(open){
    const T=[["profil","Profil"],["works","Karya"],["folders","Drive"],["tools","Alat"]];
    h+=`<aside class="dr" role="dialog" aria-label="Dashboard admin"><div class="tb">${T.map(t=>`<button class="chip" data-a="tab" data-v="${t[0]}" aria-pressed="${tab==t[0]}">${t[1]}</button>`).join("")}<button class="x" data-a="tog" aria-label="Tutup">✕</button></div><div class="bd">`;

  }
  e.innerHTML=h;
}

const norm=x=>({profile:{...SEED.profile,...(x.profile||{})},works:x.works||[],folders:x.folders||[],tools:x.tools||[]});
let auth=null,ref=null;
if(firebaseConfig.apiKey==="ISI"){ready=true;view();toast("Isi firebaseConfig di index.html dulu")}
else{
  const app=initializeApp(firebaseConfig),db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});auth=getAuth(app);ref=doc(db,"site","main");
  setTimeout(()=>{if(!ready){ready=true;view();toast("Database lambat merespons, menampilkan data sementara")}},6000);
  onAuthStateChanged(auth,u=>{
    if(u&&u.email!==ADMIN_EMAIL){toast("Akun ini tidak punya izin edit");signOut(auth);return}
    can=!!u;if(!can)open=false;adm();if(ready)view();
  });
  onSnapshot(ref,s=>{
    if(can&&open&&ready)return;
    if(s.exists()){D=norm(s.data());P=D.profile}
    ready=true;view();adm();
  },e=>{ready=true;view();toast("Gagal memuat data: "+e.code)});
}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.82))};i.src=URL.createObjectURL(f)})}
async function save(){
  $("#st").textContent="Menyimpan…";
  try{await setDoc(ref,JSON.parse(JSON.stringify(D)));$("#st").textContent="Tersimpan ✓"}
  catch(e){$("#st").textContent="";toast("Gagal menyimpan: "+(e.code||e.message))}
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-f],[data-g],[data-p],[data-a]");if(!t)return;const d=t.dataset;
  if(d.f){fw=d.f;view()}else if(d.g){ft=d.g;view()}
  else if(d.p!==undefined){const w=D.works[d.p],s=emb(w.url);if(!s||/GANTI/.test(w.url)){toast("Link Instagram belum diisi. Ganti lewat Edit situs.");return}
    const f=document.createElement("iframe");f.src=s;f.loading="lazy";f.allowFullscreen=true;f.title=w.t;const c=t.closest(".card");t.replaceWith(f);c.classList.add("play")}
  else if(d.a=="login"){e.preventDefault();if(!auth){toast("Firebase belum dikonfigurasi");return}
    if(auth.currentUser)signOut(auth);else try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){toast("Login dibatalkan")}}
  else if(d.a=="tog"){open=!open;adm()}
  else if(d.a=="tab"){tab=d.v;adm()}
  else if(d.a=="add"){D[d.v].push(Object.fromEntries(F[d.v].map(f=>[f[0],""])));adm();view();$(".bd").scrollTop=1e5}
  else if(d.a=="del"){const[s,i]=d.v.split(":");D[s].splice(+i,1);adm();view()}
  else if(d.a=="save")save();
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(!d.k)return;(d.s=="profile"?P:D[d.s][d.i])[d.k]=t.value;clearTimeout(tm);tm=setTimeout(view,350)});
document.addEventListener("change",async e=>{
  if(e.target.dataset.a!="photo"||!e.target.files[0])return;
  try{P.photo=await shrink(e.target.files[0]);view();toast("Foto siap. Klik Simpan & terbitkan.")}catch(x){toast("Foto gagal diproses")}
});
</script>
